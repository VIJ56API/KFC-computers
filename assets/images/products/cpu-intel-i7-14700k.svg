<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <!-- Card Background -->
  <rect x="10" y="10" width="380" height="300" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  
  <!-- Subtle Grid lines -->
  <path d="M 10 70 L 390 70 M 10 240 L 390 240 M 100 10 L 100 310 M 300 10 L 300 310" stroke="#f1f5f9" stroke-width="1" />

  <!-- Center Graphic Icon -->
  <g>
    <rect x="150" y="110" width="100" height="100" rx="10" fill="#f1f5f9" stroke="#0284c7" stroke-width="2"/>
            <rect x="170" y="130" width="60" height="60" rx="4" fill="#e2e8f0"/>
            <path d="M130 130 h20 M130 150 h20 M130 170 h20 M250 130 h20 M250 150 h20 M250 170 h20" stroke="#d97706" stroke-width="4"/>
            <path d="M150 90 v20 M170 90 v20 M190 90 v20 M210 90 v20 M230 90 v20" stroke="#d97706" stroke-width="4"/>
  </g>

  <!-- Product Title & Subtext Overlay -->
  <rect x="20" y="250" width="360" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="200" y="272" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#0f172a" text-anchor="middle">Intel Core i7 14700K</text>
  <text x="200" y="290" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#d97706" text-anchor="middle">LGA1700 • 20 Cores</text>
</svg>