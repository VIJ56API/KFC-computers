<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <!-- Card Background -->
  <rect x="10" y="10" width="380" height="300" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  
  <!-- Subtle Grid lines -->
  <path d="M 10 70 L 390 70 M 10 240 L 390 240 M 100 10 L 100 310 M 300 10 L 300 310" stroke="#f1f5f9" stroke-width="1" />

  <!-- Center Graphic Icon -->
  <g>
    <rect x="120" y="100" width="160" height="140" rx="6" fill="#f1f5f9" stroke="#0284c7" stroke-width="3"/>
            <rect x="140" y="120" width="45" height="45" rx="4" fill="#d97706"/>
            <rect x="200" y="120" width="60" height="15" fill="#cbd5e1"/>
            <rect x="200" y="140" width="60" height="15" fill="#cbd5e1"/>
            <rect x="140" y="180" width="120" height="15" rx="2" fill="#0284c7"/>
            <rect x="140" y="205" width="120" height="15" rx="2" fill="#cbd5e1"/>
  </g>

  <!-- Product Title & Subtext Overlay -->
  <rect x="20" y="250" width="360" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="200" y="272" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#0f172a" text-anchor="middle">MSI B650 Gaming</text>
  <text x="200" y="290" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#d97706" text-anchor="middle">AM5 • DDR5 Motherboard</text>
</svg>